# Model configuration.
# Every `params:` block is the estimator's __init__ kwargs, expanded with **.
# Every `grid:` block is a GridSearchCV param space (keys are pipeline step paths).

evaluation:
  holdout_weeks: 52
  cv_weeks: 52
  cv_splits: 5
  search_jobs: 2
  scoring: neg_mean_absolute_error

submission:
  # Stated ONCE here. The notebook previously set this in two cells that disagreed.
  model_by_city: {sj: catboost, iq: sarimax}

artifacts:
  dir: models                 # resolved against the repo root
  files:
    catboost:        dengue_pipelines.pkl
    prophet:         dengue_prophet_pipelines.pkl
    sarimax:         dengue_sarimax_pipelines.pkl
    random_forest:   dengue_rf_pipelines.pkl
    xgboost:         dengue_xgboost_pipelines.pkl
    ridge:           dengue_ridge_pipelines.pkl
    lasso:           dengue_lasso_pipelines.pkl
    seasonal_median: dengue_seasonal_median_pipelines.pkl
    shape_level:     dengue_shape_level_pipelines.pkl

models:

  # ---------------- the three original models ----------------

  catboost:
    estimator: catboost.CatBoostRegressor
    branch: tree
    seed_param: random_seed
    error_score: raise
    params:
      iterations: 1000
      depth: 6
      learning_rate: 0.02
      loss_function: MAE
      thread_count: 2
      verbose: false
      allow_writing_files: false
    grid:                      # a LIST of two spaces: with and without selection
      - model__iterations: [500, 1000]
        model__depth: [3, 4, 6]
        model__learning_rate: [0.02]
        select_features__n_features: [5, 7, 10, 15, 20, 30, 40, 50, 60]
      - model__iterations: [500, 1000]
        model__depth: [3, 4, 6]
        model__learning_rate: [0.02]
        select_features: [passthrough]

  prophet:
    estimator: DengAI.models.ProphetRegressor
    branch: time_series
    seed_param: random_state
    error_score: raise
    params:
      yearly_seasonality: 5
      changepoint_prior_scale: 0.05
      seasonality_prior_scale: 10.0
      seasonality_mode: additive
      growth: linear
    grid:
      model__yearly_seasonality: [3, 5]
      model__changepoint_prior_scale: [0.01, 0.05]

  sarimax:
    estimator: DengAI.models.SARIMAXRegressor
    branch: time_series
    error_score: nan           # non-convergence raises; score that candidate NaN
    params:
      order: [1, 0, 0]
      seasonal_order: [0, 0, 0, 0]
      fourier_order: 3
      trend: c
      maxiter: 200
    grid:
      model__order: [[1, 0, 0], [2, 0, 0], [1, 0, 1]]
      model__fourier_order: [2, 3]
      model__maxiter: [1000]

  # ---------------- additional experiments ----------------

  random_forest:
    estimator: sklearn.ensemble.RandomForestRegressor
    branch: tree               # trees tolerate the warm-up NaNs (sklearn >= 1.4)
    seed_param: random_state
    error_score: raise
    params: {n_estimators: 400, n_jobs: 2}
    grid:
      model__max_features: [0.33, sqrt]
      model__min_samples_leaf: [1, 3]
      select_features: [passthrough]

  xgboost:
    estimator: xgboost.XGBRegressor
    branch: rfe                # impute + scale, then Ridge-RFE picks the features
    seed_param: random_state
    error_score: raise
    params: {objective: "reg:squarederror", tree_method: hist, n_jobs: 2}
    grid:                      # the grid of experiments/xgboost_feature_selection.ipynb
      model__max_depth: [2, 4, 6]
      model__learning_rate: [0.03, 0.1]
      model__n_estimators: [100, 300]
      model__reg_lambda: [1, 10]
      select_features__n_features_to_select: [10, 25, 50, 100]

  ridge:
    estimator: sklearn.linear_model.RidgeCV
    branch: dense              # RidgeCV REJECTS NaN - needs impute + scale
    error_score: raise
    params: {alphas: [0.01, 0.1, 1.0, 10.0, 100.0, 1000.0, 10000.0]}
    grid:
      select_features: [passthrough]

  lasso:
    estimator: sklearn.linear_model.LassoCV
    branch: dense
    seed_param: random_state
    error_score: raise
    # eps shortens the penalty path: the near-zero penalties never win and are the
    # ones whose coordinate descent cannot converge on these collinear features.
    params: {cv: 5, max_iter: 20000, n_jobs: 2, eps: 0.01}
    grid:
      select_features: [passthrough]

  seasonal_median:
    estimator: DengAI.models.SeasonalMedianRegressor
    branch: seasonal           # calendar only; no weather, no imputation
    error_score: raise
    params: {statistic: median, smooth_window: 5}
    grid:
      model__statistic: [median, mean]
      model__smooth_window: [1, 5, 9]

  shape_level:
    estimator: DengAI.models.ShapeLevelRegressor
    branch: seasonal
    error_score: raise
    params:
      shape_statistic: mean
      smooth_window: 5
      min_weeks_per_year: 45
      level_statistic: median
    grid:
      model__shape_statistic: [mean, median]
      model__smooth_window: [1, 5, 9]
